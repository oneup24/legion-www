<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#272729"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Logo mark -->
  <g transform="translate(80, 100)" stroke="#2997ff" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <polygon points="40,0 78,22 78,66 40,88 2,66 2,22"/>
    <polygon points="40,16 65,30 65,58 40,72 15,58 15,30" opacity="0.55"/>
    <polygon points="40,28 53,36 53,52 40,60 27,52 27,36" opacity="0.3"/>
  </g>
  <circle cx="180" cy="122" r="6" fill="#2997ff"/>
  <!-- Wordmark -->
  <text x="220" y="80" fill="#ffffff" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" letter-spacing="-0.04em">LegionOne</text>
  <line x1="220" y1="86" x2="350" y2="86" stroke="#0066cc" stroke-width="3"/>
  <!-- Headline -->
  <text x="80" y="320" fill="#ffffff" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="84" font-weight="600" letter-spacing="-0.02em">少數精銳，全力出擊。</text>
  <text x="80" y="420" fill="#cccccc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" font-weight="400">為香港中小企而設的 ERP + CRM 平台</text>
  <!-- Footer pill -->
  <rect x="80" y="490" width="220" height="56" rx="28" fill="#0066cc"/>
  <text x="190" y="525" fill="#ffffff" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" text-anchor="middle">預約免費示範</text>
  <!-- Domain -->
  <text x="1120" y="580" fill="#7a7a7a" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" text-anchor="end">legionone.hk</text>
</svg>